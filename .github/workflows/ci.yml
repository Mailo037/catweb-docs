name: CI

on:
  pull_request:
  push:
    branches-ignore:
      - main  # main is covered by deploy.yml, which calls this workflow
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check bundle.js is up to date
        run: |
          npm run --silent build
          if ! git diff --quiet -- web-runner/bundle.js; then
            echo "::error file=web-runner/bundle.js::bundle.js is out of date. Run 'npm run build' and commit the result."
            exit 1
          fi

      - name: Run all test suites
        run: npm test
