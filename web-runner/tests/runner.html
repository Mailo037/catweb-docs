<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CatWeb JSON Web Runner & Renderer — In-Browser Test Suite</title>
  <style>
    :root {
      --bg: #09090b;
      --card-bg: #18181b;
      --border: #27272a;
      --text: #f4f4f5;
      --text-muted: #a1a1aa;
      --green: #22c55e;
      --red: #ef4444;
      --blue: #3b82f6;
      --cyan: #06b6d4;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding: 24px;
    }
    .header {
      max-width: 1000px;
      margin: 0 auto 24px auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      padding-bottom: 16px;
    }
    .header h1 {
      font-size: 24px;
      font-weight: 700;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .header .subtitle {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 4px;
    }
    .btn-run {
      background: var(--blue);
      color: #fff;
      border: none;
      padding: 8px 18px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      font-size: 14px;
      transition: background 0.2s;
    }
    .btn-run:hover {
      background: #2563eb;
    }
    .summary-grid {
      max-width: 1000px;
      margin: 0 auto 24px auto;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
    }
    .metric-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      text-align: center;
    }
    .metric-title {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 6px;
    }
    .metric-value {
      font-size: 28px;
      font-weight: 700;
    }
    .metric-value.total { color: var(--text); }
    .metric-value.passed { color: var(--green); }
    .metric-value.failed { color: var(--red); }
    .metric-value.time { color: var(--cyan); }
    .progress-bar-container {
      max-width: 1000px;
      margin: 0 auto 24px auto;
      height: 8px;
      background: var(--card-bg);
      border-radius: 4px;
      overflow: hidden;
      border: 1px solid var(--border);
    }
    .progress-bar {
      height: 100%;
      width: 0%;
      background: var(--green);
      transition: width 0.1s ease;
    }
    .progress-bar.has-failed {
      background: var(--red);
    }
    .controls {
      max-width: 1000px;
      margin: 0 auto 16px auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .filter-buttons {
      display: flex;
      gap: 8px;
    }
    .filter-btn {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
    }
    .filter-btn.active {
      background: var(--border);
      color: var(--text);
      font-weight: 600;
    }
    .results-container {
      max-width: 1000px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .suite-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }
    .suite-header {
      padding: 12px 18px;
      background: rgba(255, 255, 255, 0.02);
      border-bottom: 1px solid var(--border);
      font-weight: 600;
      font-size: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .test-list {
      list-style: none;
    }
    .test-item {
      padding: 10px 18px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 13px;
    }
    .test-item:last-child {
      border-bottom: none;
    }
    .test-title-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .badge {
      font-size: 11px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 4px;
      text-transform: uppercase;
    }
    .badge.pass {
      background: rgba(34, 197, 94, 0.15);
      color: var(--green);
    }
    .badge.fail {
      background: rgba(239, 68, 68, 0.15);
      color: var(--red);
    }
    .test-time {
      color: var(--text-muted);
      font-size: 12px;
    }
    .error-box {
      margin: 8px 18px 12px 18px;
      padding: 10px;
      background: rgba(239, 68, 68, 0.08);
      border-left: 3px solid var(--red);
      font-family: monospace;
      font-size: 12px;
      color: #fca5a5;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>

  <div class="header">
    <div>
      <h1>🐱 CatWeb JSON Web Runner & Renderer</h1>
      <div class="subtitle">Comprehensive In-Browser E2E Test Suite (Tiers 1–4)</div>
    </div>
    <button class="btn-run" id="btn-run">Run All Tests</button>
  </div>

  <div class="summary-grid">
    <div class="metric-card">
      <div class="metric-title">Total Tests</div>
      <div class="metric-value total" id="val-total">0</div>
    </div>
    <div class="metric-card">
      <div class="metric-title">Passed</div>
      <div class="metric-value passed" id="val-passed">0</div>
    </div>
    <div class="metric-card">
      <div class="metric-title">Failed</div>
      <div class="metric-value failed" id="val-failed">0</div>
    </div>
    <div class="metric-card">
      <div class="metric-title">Execution Time</div>
      <div class="metric-value time" id="val-time">0 ms</div>
    </div>
  </div>

  <div class="progress-bar-container">
    <div class="progress-bar" id="progress-bar"></div>
  </div>

  <div class="controls">
    <div class="filter-buttons">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="passed">Passed</button>
      <button class="filter-btn" data-filter="failed">Failed</button>
    </div>
  </div>

  <div class="results-container" id="results-container"></div>

  <script type="module">
    import { registry } from './harness.js';

    // Elements
    const btnRun = document.getElementById('btn-run');
    const valTotal = document.getElementById('val-total');
    const valPassed = document.getElementById('val-passed');
    const valFailed = document.getElementById('val-failed');
    const valTime = document.getElementById('val-time');
    const progressBar = document.getElementById('progress-bar');
    const resultsContainer = document.getElementById('results-container');
    const filterBtns = document.querySelectorAll('.filter-btn');

    let currentFilter = 'all';

    filterBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        filterBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilter = btn.dataset.filter;
        applyFilter();
      });
    });

    function applyFilter() {
      const items = document.querySelectorAll('.test-item');
      items.forEach(item => {
        const passed = item.dataset.passed === 'true';
        if (currentFilter === 'all') {
          item.style.display = '';
        } else if (currentFilter === 'passed' && passed) {
          item.style.display = '';
        } else if (currentFilter === 'failed' && !passed) {
          item.style.display = '';
        } else {
          item.style.display = 'none';
        }
      });
    }

    async function executeTests() {
      btnRun.disabled = true;
      btnRun.textContent = 'Running...';
      resultsContainer.innerHTML = '';
      valTotal.textContent = '0';
      valPassed.textContent = '0';
      valFailed.textContent = '0';
      valTime.textContent = '0 ms';
      progressBar.style.width = '0%';
      progressBar.classList.remove('has-failed');

      registry.clear();

      await import('./tier1_features.test.js');
      await import('./tier2_boundaries.test.js');
      await import('./tier3_combinations.test.js');
      await import('./tier4_samples.test.js');

      let executedCount = 0;
      let passedCount = 0;
      let failedCount = 0;

      const onProgress = (testResult) => {
        executedCount++;
        if (testResult.passed) passedCount++;
        else {
          failedCount++;
          progressBar.classList.add('has-failed');
        }
        valTotal.textContent = String(executedCount);
        valPassed.textContent = String(passedCount);
        valFailed.textContent = String(failedCount);
        progressBar.style.width = `${Math.min(100, (executedCount / 200) * 100)}%`;
      };

      const results = await registry.runAll(onProgress);

      valTime.textContent = `${results.durationMs} ms`;
      progressBar.style.width = '100%';

      // Render suite structure
      function renderSuiteDom(suite, parentDom) {
        const card = document.createElement('div');
        card.className = 'suite-card';

        const header = document.createElement('div');
        header.className = 'suite-header';
        header.textContent = suite.name;
        card.appendChild(header);

        if (suite.tests && suite.tests.length > 0) {
          const list = document.createElement('ul');
          list.className = 'test-list';

          for (const t of suite.tests) {
            const li = document.createElement('li');
            li.className = 'test-item';
            li.dataset.passed = String(t.passed);

            const titleGroup = document.createElement('div');
            titleGroup.className = 'test-title-group';

            const badge = document.createElement('span');
            badge.className = `badge ${t.passed ? 'pass' : 'fail'}`;
            badge.textContent = t.passed ? 'PASS' : 'FAIL';

            const title = document.createElement('span');
            title.textContent = t.name;

            titleGroup.appendChild(badge);
            titleGroup.appendChild(title);

            const time = document.createElement('span');
            time.className = 'test-time';
            time.textContent = `${t.durationMs} ms`;

            li.appendChild(titleGroup);
            li.appendChild(time);
            list.appendChild(li);

            if (!t.passed && t.error) {
              const errBox = document.createElement('div');
              errBox.className = 'error-box';
              errBox.textContent = t.error.message || String(t.error);
              list.appendChild(errBox);
            }
          }
          card.appendChild(list);
        }

        parentDom.appendChild(card);

        for (const sub of suite.suites) {
          renderSuiteDom(sub, parentDom);
        }
      }

      for (const s of results.suites) {
        renderSuiteDom(s, resultsContainer);
      }

      applyFilter();
      btnRun.disabled = false;
      btnRun.textContent = 'Rerun Tests';
    }

    btnRun.addEventListener('click', executeTests);
    executeTests();
  </script>
</body>
</html>
